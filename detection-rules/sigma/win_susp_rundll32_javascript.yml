
title: Suspicious Rundll32 JavaScript Execution
id: 6c2c8f47-9a31-4d12-b825-7f0a3e1d6492
status: experimental
description: Detects rundll32.exe command lines containing a JavaScript invocation pattern.
logsource:
    category: process_creation
    product: windows
detection:
    selection_image:
        Image|endswith: '\rundll32.exe'
    selection_command:
        CommandLine|contains: 'javascript:'
    condition: selection_image and selection_command
falsepositives:
    - Unusual legitimate use of rundll32.exe with JavaScript-related arguments
level: medium
tags:

    - attack.t1218.011
